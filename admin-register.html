<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Register · Pickleball courts</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <a href="index.html" class="nav-brand" aria-label="Pickleball courts - Home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span class="nav-wordmark">Pickleball courts</span>
        </a>
        <span class="admin-tag">Admin</span>
      </div>

      <div class="login-header">
        <h1>Create account</h1>
        <p>Register to access the admin panel.</p>
      </div>

      <div id="alert-container"></div>

      <form id="register-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="input-field" type="email" id="email" name="email" required autocomplete="email" placeholder="admin@example.com" aria-required="true">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input class="input-field" type="password" id="password" name="password" required autocomplete="new-password" placeholder="••••••••" aria-required="true" minlength="8">
          <div class="helper-text">At least 8 characters</div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input class="input-field" type="password" id="confirm-password" name="confirm_password" required autocomplete="new-password" placeholder="••••••••" aria-required="true">
        </div>

        <button type="submit" class="btn btn-primary login-submit">Create account →</button>
      </form>

      <p class="login-link">
        Already have an account? <a href="admin-login.html">Sign in</a>
      </p>

      <a href="index.html" class="login-back">← Back to home</a>
    </div>

    <p class="login-footnote">Pickleball courts · Staff access only</p>
  </main>

  <script src="app.js"></script>
  <script>
    const form = document.getElementById('register-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const submitBtn = form.querySelector('button[type="submit"]');

      if (!email || !password || !confirmPassword) {
        showAlert('Please fill in all fields.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 8) {
        showAlert('Password must be at least 8 characters.', 'error');
        return;
      }

      showLoading(submitBtn);

      try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });

        if (error) throw error;

        if (data.user && !data.session) {
          hideLoading(submitBtn);
          showAlert('Account created! Please check your email to confirm your address.', 'success');
          setTimeout(() => window.location.href = 'admin-login.html', 3000);
        } else if (data.session) {
          hideLoading(submitBtn);
          const { data: profile } = await supabaseClient.from('profiles').select('is_admin').eq('id', data.user.id).single();

          if (!profile?.is_admin) {
            await supabaseClient.auth.signOut();
            showAlert('Account created but admin access not granted. Contact an admin to enable access.', 'info');
            setTimeout(() => window.location.href = 'admin-login.html', 3000);
          } else {
            window.location.href = 'admin.html';
          }
        }
      } catch (err) {
        hideLoading(submitBtn);
        let message = err.message;
        if (err.message.includes('User already registered')) {
          message = 'An account with this email already exists. Please sign in instead.';
        } else if (err.message.includes('Password should be at least')) {
          message = 'Password must be at least 6 characters.';
        } else if (err.message.includes('Invalid email')) {
          message = 'Please enter a valid email address.';
        } else if (err.message.includes('Too many requests')) {
          message = 'Too many registration attempts. Please wait a moment and try again.';
        }
        showAlert(message, 'error');
      }
    });
  </script>
</body>
</html>
